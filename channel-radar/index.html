<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>채널 레이더</title>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("cr.theme")||'"dark"')==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#172036; --surface:#212c48; --ink:#f3f6fb; --muted:#a9b6cd; --line:#34425f;
  --brand:#35e0c2; --brand-soft:rgba(53,224,194,.12);
  --accent:#ff5a4d; --accent-soft:#3a1a1c; --up:#3ddc97; --up-soft:#11302a; --down:#7aa8ff;
  --warm:#ffb454; --warm-soft:#33260f;
  --display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --hover:rgba(255,255,255,.055); --chipbg:rgba(255,255,255,.1); --well:rgba(8,14,30,.28); --head:rgba(23,32,54,.92); --on-brand:#06221d; --glow:rgba(53,224,194,.2);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f4f8; --surface:#ffffff; --ink:#131722; --muted:#5b6678; --line:#dde2ea;
  --brand:#0b8f7a; --brand-soft:rgba(11,143,122,.12);
  --accent:#e0352b; --accent-soft:#fde9e7; --up:#0b8a5c; --up-soft:#e2f5ec; --down:#3767c9;
  --warm:#b25c00; --warm-soft:#fdf0dc;
  --hover:rgba(15,25,45,.04); --chipbg:rgba(15,25,45,.07); --well:rgba(15,25,45,.045); --head:rgba(255,255,255,.9); --on-brand:#ffffff; --glow:rgba(11,143,122,.12);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:60px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.brand i{width:18px;height:18px;border-radius:50%;border:3px solid var(--accent);position:relative;display:inline-block}
.brand i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
nav a:hover{background:var(--bg);color:var(--ink)}
nav a.on{background:var(--ink);color:var(--surface)}
nav a .cnt{font-size:12px;margin-left:4px;opacity:.8}
.quota{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}

main{padding:26px 0 40px}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.25;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px;max-width:66ch}
h2{font-size:17px;margin:0 0 10px}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.f select,.f input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);min-width:120px;max-width:220px}
.f.grow{flex:1;min-width:180px}
.f.grow input{width:100%;max-width:none}
.summary{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:0 2px 10px}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;background:var(--muted);object-fit:cover}
.pill{display:inline-block;min-width:58px;text-align:center;padding:3px 9px;border-radius:999px;font-weight:700;font-size:13px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.warm{background:var(--warm-soft);color:var(--warm)}
.pill.hot{background:var(--accent);color:#fff}
.star{border:0;background:none;font-size:19px;line-height:1;color:var(--line);padding:4px 6px;border-radius:6px}
.star:hover{color:var(--warm)}
.star.on{color:#f2a900}
.est{font-size:10px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:middle}

.sortbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 2px 10px;font-size:12px;color:var(--muted);font-weight:500}
.sortbtn{border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.sortbtn:hover{color:var(--ink)}
.sortbtn.on{color:var(--accent);border-color:var(--accent)}
.sortbtn .arr{margin-left:4px;font-size:10px}
.crow{display:grid;grid-template-columns:minmax(230px,1.3fr) 70px minmax(280px,2fr) 60px 160px 40px;gap:16px;align-items:center;padding:16px;border-top:1px solid var(--line);cursor:pointer}
.crow:first-child{border-top:0}
.crow:hover{background:var(--bg)}
.cinfo{display:flex;gap:10px;align-items:flex-start;min-width:0}
.rk-n{flex:none;width:26px;text-align:center;color:var(--muted);font-weight:600;padding-top:10px;font-variant-numeric:tabular-nums}
.cinfo .av{width:44px;height:44px;border-radius:12px;font-size:18px}
.cinfo .nm{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.handle{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tg{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tg.a{color:var(--down);border-color:var(--down)}
.tg.b{color:var(--up);border-color:var(--up)}
.cnum{text-align:center;font-variant-numeric:tabular-nums}
.cnum small,.cday small{display:block;font-size:11px;color:var(--muted)}
.tiles{display:flex;gap:8px;min-width:0}
.tile{flex:1;max-width:84px;aspect-ratio:9/16;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;padding:5px;color:#fff;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--line) center/cover no-repeat;text-decoration:none}
.tile:hover{outline:2px solid var(--accent)}
.tile span{background:rgba(0,0,0,.55);padding:1px 6px;border-radius:4px;white-space:nowrap}
.cday{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;font-variant-numeric:tabular-nums}
.cday .gain{color:var(--accent);font-size:17px}
.cact{display:flex;flex-direction:column;gap:6px;align-items:center}
.ibtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{color:var(--ink)}
.more{display:block;width:100%;padding:12px;border:0;border-top:1px solid var(--line);background:none;font-weight:600;color:var(--muted);border-radius:0 0 12px 12px}
.more:hover{background:var(--bg);color:var(--ink)}

.rk .row{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer;border-top:1px solid var(--line)}
.rk .row:first-child{border-top:0}
.rk .row:hover{background:var(--bg)}
.rk .n{width:26px;text-align:center;font-family:var(--display);font-size:18px;color:var(--muted)}
.rk .row:nth-child(-n+3) .n{color:var(--accent)}
.rk .meta{font-size:12px;color:var(--muted)}
.rk .gain{margin-left:auto;font-weight:700;color:var(--up);font-variant-numeric:tabular-nums;white-space:nowrap}

.kw .row{display:grid;grid-template-columns:34px minmax(110px,200px) 1fr 90px;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer}
.kw .row:first-child{border-top:0}
.kw .row:hover,.kw .row.open{background:var(--bg)}
.kw .n{font-family:var(--display);font-size:17px;color:var(--muted);text-align:center}
.kw .word{font-weight:600;overflow-wrap:anywhere}
.kw .word small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.kw .row:hover .bar,.kw .row.open .bar{background:var(--line)}
.bar span{display:block;height:100%;background:var(--accent);border-radius:5px}
.kwv{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.kwch{background:var(--bg);padding:2px 16px 12px 62px;border-top:1px dashed var(--line)}
.kwch h3{font-size:12px;margin:8px 0;color:var(--muted);font-weight:600}
.krow{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.krow:hover{border-color:var(--accent)}
.krow .kn{min-width:0;margin-right:auto}
.krow .kn b{display:block;overflow-wrap:anywhere}
.krow .kn small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.krow .g{font-weight:700;color:var(--up);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.vid{overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;display:flex;align-items:flex-end;justify-content:space-between;padding:10px;color:#fff;font-weight:700;font-size:12px;background:var(--line) center/cover no-repeat;text-decoration:none}
.thumb .tag{background:rgba(0,0,0,.6);padding:2px 8px;border-radius:5px}
.vid .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.vid .t{font-weight:600;line-height:1.4;text-decoration:none;overflow-wrap:anywhere}
.vid .t:hover{text-decoration:underline}
.vid .m{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);text-align:left;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.linkbtn:hover{color:var(--ink)}

.shade{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:9;display:none}
.shade.open{display:block}
aside.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:10;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:20px}
aside.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){aside.drawer{transition:none}}
.drawer .head{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.drawer .head .av{width:52px;height:52px;font-size:21px}
.drawer .head h3{margin:0;font-size:18px;overflow-wrap:anywhere}
.drawer .head .meta{font-size:12px;color:var(--muted)}
.drawer .x{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 11px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat{background:var(--bg);border-radius:10px;padding:11px 13px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}
.stat.key b{color:var(--accent)}
.rv{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}
.rv:hover b{text-decoration:underline}
.rv img{flex:none;width:112px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--line)}
.rv b{display:block;line-height:1.35;overflow-wrap:anywhere}
.rv small{color:var(--muted)}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);font-weight:600;text-decoration:none;text-align:center}
.btn.block{display:block;width:100%;margin-top:10px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.yt{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{padding:18px;margin-bottom:14px}
.panel p{margin:0 0 12px;color:var(--muted);max-width:70ch}
.panel .line{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.panel ol{margin:0 0 12px;padding-left:20px;color:var(--muted)}
.guide{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:14px;background:var(--bg)}
.guide summary{cursor:pointer;font-weight:600;padding:12px 0}
.steps{display:flex;flex-direction:column;gap:14px;padding:4px 0 12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px}
.step p{margin:4px 0 8px}
.guide .note{font-size:13px;border-top:1px solid var(--line);padding:12px 0;margin:0}
.keymsg{margin:12px 0 0!important;padding:10px 12px;border-radius:8px;font-weight:600;max-width:none!important}
.keymsg.good{background:var(--up-soft);color:var(--up)!important}
.keymsg.bad{background:var(--accent-soft);color:var(--accent)!important}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.ok{color:var(--up);font-weight:600}
.err{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-weight:500;display:flex;gap:12px;align-items:flex-start}
.err button{margin-left:auto;border:0;background:none;color:inherit;font-weight:700}
.status{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--surface);padding:10px 20px;font-size:14px;font-weight:500;z-index:8;display:none}
.status.on{display:block}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;display:none;max-width:90%}
.toast.on{display:block}

@media (max-width:900px){
  .crow{grid-template-columns:1fr 64px 56px;gap:12px}
  .cinfo{order:1}.c-subs{order:2}.c-vids{order:3}
  .tiles{order:4;grid-column:1/-1}
  .cday{order:5;grid-column:1/3;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:6px 10px;text-align:left}
  .cact{order:6;flex-direction:row;justify-content:flex-end}
  h1{font-size:25px}
  .kw .row{grid-template-columns:28px 1fr 80px}
  .kw .bar{display:none}
  .kwch{padding-left:16px}
  .krow{flex-wrap:wrap}
  .quota{margin-left:0}
}

/* ---------- 다크 스킨 ---------- */
body{background:radial-gradient(1000px 460px at 50% -120px,var(--glow),transparent 70%) no-repeat,var(--bg)}
.wrap{max-width:1260px}
header.top{background:var(--head);backdrop-filter:blur(10px)}
.brand i{border-color:var(--brand)}.brand i::after{background:var(--brand)}
nav a.on{background:var(--brand-soft);color:var(--brand)}
nav a:hover{background:var(--hover)}
:focus-visible{outline-color:var(--brand)}
h1{font-family:var(--body);font-weight:700;letter-spacing:-.02em}
.hero{text-align:center;padding:14px 0 30px}
.hero .ico{width:74px;height:74px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 20px;box-shadow:0 0 70px rgba(53,224,194,.28)}
.hero .ico span{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--brand),#1b9fd6);display:grid;place-items:center;color:var(--on-brand)}
.hero h1{font-size:50px;line-height:1.15;margin:0}
.hero p{font-size:18px;color:var(--muted);margin:12px auto 0;max-width:60ch}
.hero em{white-space:nowrap;font-style:normal;color:var(--brand);font-weight:700}
.filters{border-radius:18px;padding:18px}
.f select,.f input{border-radius:10px;padding:10px 12px}
.card{border-radius:18px}
.card.rows{overflow:hidden}
.summary{display:inline-flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 4px;margin:0 0 12px}
.summary span{padding:0 14px;border-left:1px solid var(--line)}
.summary span:first-child{border-left:0}
.summary span:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:8px}
.summary b{font-family:var(--mono);font-size:14px}
.sortbar{margin-bottom:12px}
.sortbtn{background:var(--surface);border-radius:10px;padding:8px 13px;font-size:13px}
.sortbtn.on{background:var(--accent-soft)}
.chead{display:grid;grid-template-columns:minmax(230px,1.3fr) 70px minmax(280px,2fr) 60px 160px 40px;gap:16px;padding:14px 18px;background:var(--hover);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:600}
.chead span:nth-child(2),.chead span:nth-child(4){text-align:center}
.chead span:nth-child(5){text-align:right}
.chead + .crow{border-top:0}
.crow{padding:22px 18px}
.crow:hover,.rk .row:hover{background:var(--hover)}
.cinfo .av{width:56px;height:56px;border-radius:15px;border:2px solid var(--line)}
.cinfo .nm{font-size:18px}
.handle{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 7px;margin-top:4px}
.handle:empty{display:none}
.tg{border-radius:6px;padding:2px 8px;font-size:12px}
.tg.a{background:color-mix(in srgb,var(--down) 12%,transparent);border-color:color-mix(in srgb,var(--down) 45%,transparent)}
.tg.b{background:color-mix(in srgb,var(--up) 12%,transparent);border-color:color-mix(in srgb,var(--up) 45%,transparent)}
.tile{max-width:98px;border-radius:10px;border:1px solid var(--line)}
.tile:hover{outline-color:var(--brand)}
.cnum b{font-family:var(--mono);font-size:16px}
.cday .gain{font-family:var(--mono);font-size:18px}
.pill{font-family:var(--mono);background:var(--chipbg)}
.pill.hot{background:linear-gradient(135deg,#ff5a4d,#ff8a3d)}
.cact .ibtn,.cact .star{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;padding:0;color:var(--muted)}
.cact .star.on{color:#f2a900;border-color:#f2a900}
.more:hover{background:var(--hover)}
.kw .row:hover,.kw .row.open{background:var(--hover)}
.bar{background:var(--chipbg)}
.bar span{background:linear-gradient(90deg,var(--brand),#1b9fd6)}
.kwch,.guide{background:var(--well)}
.btn{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.btn.yt{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:transparent;color:var(--accent);border-color:var(--accent)}
.step .no{background:var(--brand);color:var(--on-brand)}
.chip{background:var(--surface)}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.krow:hover{border-color:var(--brand)}
.status{background:var(--brand);color:var(--on-brand)}
.toast{background:var(--ink);color:var(--bg)}
.stat{background:var(--well)}
.thumb{border-bottom:1px solid var(--line)}
@media (min-width:901px){.cnum small{display:none}}
@media (max-width:900px){.chead{display:none}.hero h1{font-size:34px}.hero p{font-size:16px}.summary{display:flex;border-radius:14px;flex-direction:column;gap:6px;padding:10px 4px}.summary span{border-left:0}}

<script>
"use strict";
var APP_VERSION="1.3.9";
var WEB_URL="https://womantechcs-boop.github.io/channel-radar/";
/* ================= 저장소 (이 컴퓨터의 브라우저에만 저장) ================= */
var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v,function(key,val){return key==="_v"?undefined:val}));return true}catch(e){return false}}
};
var KEY=LS.get("cr.key","");
var DB={};          // 채널 id -> 채널 기록
var FAV=LS.get("cr.fav",{});
var QUOTA=LS.get("cr.quota",{day:"",used:0,search:0});
var SOUND=LS.get("cr.sound",true),BROWSER=LS.get("cr.browser","chrome"),upd=null;
var clickUrl=null,soundErr="",soundMsg="";
function clickWave(sr){
  var len=Math.floor(sr*0.11),d=new Float32Array(len),seed=12345,prev=0,i;
  for(i=0;i<len;i++){
    seed=(seed*1103515245+12345)&0x7fffffff;var r=seed/0x3fffffff-1;prev=0.6*r+0.4*prev;
    var t=i/sr,t2=t-0.05,x=0;
    if(t<0.02)x+=prev*Math.exp(-t*380)*0.9+Math.sin(2*Math.PI*3200*t)*Math.exp(-t*300)*0.45;      // 딸
    if(t2>=0&&t2<0.035)x+=prev*Math.exp(-t2*260)*0.75+Math.sin(2*Math.PI*2100*t2)*Math.exp(-t2*220)*0.45; // 깍
    d[i]=Math.max(-1,Math.min(1,x));
  }
  return d;
}
// 딸깍 소리를 직접 만들어(WAV) 일반 오디오로 재생한다
function makeClick(){
  var sr=22050,wave=clickWave(sr),len=wave.length,buf=new ArrayBuffer(44+len*2),v=new DataView(buf),i;
  function w(o,str){for(var k=0;k<str.length;k++)v.setUint8(o+k,str.charCodeAt(k))}
  w(0,"RIFF");v.setUint32(4,36+len*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,len*2,true);
  for(i=0;i<len;i++)v.setInt16(44+i*2,Math.round(wave[i]*32767),true);
  var bin="",u=new Uint8Array(buf);for(i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);
  return "data:audio/wav;base64,"+btoa(bin);
}
var actx=null,clickBuf=null,shellInfo=null;
// 소리 장치를 미리 깨워 두고 계속 열어 둔다 (짧은 소리가 장치 켜지는 사이에 잘리는 것을 막기 위해)
function wakeAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!actx){
      actx=new AC();
      var sr=actx.sampleRate,wave=clickWave(sr);clickBuf=actx.createBuffer(1,wave.length,sr);clickBuf.getChannelData(0).set(wave);
      var keep=actx.createOscillator(),kg=actx.createGain();keep.frequency.value=30;kg.gain.value=0.0002;keep.connect(kg);kg.connect(actx.destination);keep.start();
    }
    if(actx.state!=="running")actx.resume();
  }catch(e){}
}
function beep(){try{wakeAudio();var t=actx.currentTime+0.35,o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.35,t+0.02);g.gain.setValueAtTime(0.35,t+0.5);g.gain.linearRampToValueAtTime(0.0001,t+0.6);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.65)}catch(e){soundErr=String(e&&e.message||e)}}
function clickSound(force){
  if(!SOUND&&!force)return;
  soundErr="";
  try{
    wakeAudio();
    if(actx&&clickBuf&&actx.state==="running"){var src=actx.createBufferSource();src.buffer=clickBuf;src.connect(actx.destination);src.start();return}
    clickUrl=clickUrl||makeClick();
    var a=new Audio(clickUrl);a.volume=1;
    var p=a.play();if(p&&p["catch"])p["catch"](function(e){soundErr=String(e&&e.message||e)});
  }catch(e){soundErr=String(e&&e.message||e)}
}
function setTheme(t){
  t=t==="light"?"light":"dark";document.documentElement.dataset.theme=t;LS.set("cr.theme",t);
  Array.prototype.forEach.call(document.querySelectorAll("[data-theme-set]"),function(b){b.classList.toggle("on",b.dataset.themeSet===t);b.setAttribute("aria-pressed",b.dataset.themeSet===t)});
}
function checkUpdate(silent){
  if(!window.radar){upd={web:true};return Promise.resolve()}
  if(!silent){upd={checking:true};if(cur==="collect")renderCollect()}
  return window.radar.check(APP_VERSION).then(function(r){
    upd=r;$("#updDot").innerHTML=r&&r.ok&&r.newer?'<span class="dot" title="새 버전이 있습니다"></span>':"";
    if(r&&r.ok&&r.newer&&silent)toast("새 버전 "+r.latest+"이 나왔습니다. '데이터 수집·설정'에서 업데이트할 수 있습니다.");
    if(cur==="collect")renderCollect();
  },function(e){upd={ok:false,error:String(e&&e.message||e)};if(cur==="collect")renderCollect()});
}
function updateHtml(){
  var h='<p>현재 버전 <b>'+APP_VERSION+'</b>'+(window.radar?(shellInfo&&shellInfo.shell?' · 프로그램 파일 '+shellInfo.shell+'번 (소리 방식 '+shellInfo.audioMode+'번)':' · <b style="color:var(--accent)">프로그램 파일이 예전 것입니다. 소리와 크롬으로 열기 수정은 새 zip의 프로그램에서만 동작합니다.</b>'):'')+'</p>';
  if(!window.radar){
    return h+(location.protocol.indexOf("http")===0?'<p>웹 버전은 열 때마다 항상 최신 버전입니다.</p>':'<p>이 파일은 자동 업데이트를 지원하지 않습니다. 최신 버전은 <a href="'+WEB_URL+'" target="_blank" rel="noopener">웹 버전</a>에서 바로 쓸 수 있습니다.</p>');
  }
  h+='<div class="line"><button type="button" class="btn ghost" data-act="check-update"'+(upd&&upd.checking?" disabled":"")+'>'+(upd&&upd.checking?"확인 중…":"업데이트 확인")+'</button>';
  if(upd&&upd.ok&&upd.newer)h+='<button type="button" class="btn" data-act="apply-update">버전 '+esc(upd.latest)+'(으)로 지금 업데이트</button>';
  h+='</div>';
  if(upd&&upd.ok&&upd.newer)h+='<div class="updbox new"><b>새 버전 '+esc(upd.latest)+'이 있습니다.</b>'+(upd.notes?'<br>'+esc(upd.notes):'')+'<br>업데이트해도 API 키와 수집한 데이터는 그대로 남습니다.</div>';
  else if(upd&&upd.ok)h+='<div class="updbox">최신 버전을 쓰고 있습니다.</div>';
  else if(upd&&upd.ok===false)h+='<div class="updbox">업데이트를 확인하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요. ('+esc(upd.error)+')</div>';
  return h;
}
var M={};                           // 채널 id -> 계산된 지표
var DAY=864e5;

var CAT={1:"영화/애니메이션",2:"자동차",10:"음악",15:"반려동물/동물",17:"스포츠",19:"여행/이벤트",20:"게임",22:"인물/블로그",23:"코미디",24:"엔터테인먼트",25:"뉴스/정치",26:"노하우/스타일",27:"교육",28:"과학기술",29:"비영리/사회운동"};
var COUNTRY={KR:"한국",US:"미국",JP:"일본",IN:"인도",GB:"영국",CA:"캐나다",AU:"호주",DE:"독일",FR:"프랑스",BR:"브라질",MX:"멕시코",ID:"인도네시아",VN:"베트남",TH:"태국",PH:"필리핀",TW:"대만",HK:"홍콩",ES:"스페인",RU:"러시아",TR:"튀르키예",IT:"이탈리아",SA:"사우디아라비아",EG:"이집트",AE:"아랍에미리트",NL:"네덜란드",PL:"폴란드",SE:"스웨덴",SG:"싱가포르",MY:"말레이시아",PK:"파키스탄",BD:"방글라데시",AR:"아르헨티나",CO:"콜롬비아",CN:"중국",UA:"우크라이나",NG:"나이지리아",ZA:"남아프리카공화국"};
var REGIONS=[["KR","한국"],["US","미국"],["JP","일본"],["GB","영국"],["CA","캐나다"],["AU","호주"],["IN","인도"],["DE","독일"],["FR","프랑스"],["ES","스페인"],["IT","이탈리아"],["BR","브라질"],["MX","멕시코"],["ID","인도네시아"],["VN","베트남"],["TH","태국"],["PH","필리핀"],["TW","대만"],["HK","홍콩"],["TR","튀르키예"],["SA","사우디아라비아"],["EG","이집트"],["RU","러시아"]];
var LANG={KR:"ko",JP:"ja",DE:"de",FR:"fr",ES:"es",MX:"es",IT:"it",BR:"pt",ID:"id",VN:"vi",TH:"th",TW:"zh-Hant",HK:"zh-Hant",TR:"tr",SA:"ar",EG:"ar",RU:"ru"};
var PRESETS=["시니어 건강","사연","드라마 리뷰","해외반응","쇼핑 리뷰","영어 회화","동기부여","미스터리","역사","경제 뉴스","자취 요리","재테크","홈트","플레이리스트"];

/* ================= 도우미 ================= */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmt(n){
  if(n==null||isNaN(n))return "–";
  if(n>=1e8)return (n/1e8).toFixed(1)+"억";
  if(n>=1e6)return Math.round(n/1e4).toLocaleString("ko-KR")+"만";
  if(n>=1e4)return (n/1e4).toFixed(1)+"만";
  return Math.round(n).toLocaleString("ko-KR");
}
function cname(code){return COUNTRY[code]||code||"국가 미표시"}
function pill(r){if(r==null)return '<span class="pill">–</span>';var cls=r>=3?"hot":r>=1?"warm":"";return '<span class="pill '+cls+'">×'+(r>=10?r.toFixed(0):r>=1?r.toFixed(1):r.toFixed(2))+'</span>'}
function age(ms){if(!ms)return "–";var m=Math.max(0,Math.floor((Date.now()-ms)/(30.44*DAY)));return m>=12?Math.floor(m/12)+"년"+(m%12?" "+m%12+"개월":"")+" 전":m>0?m+"개월 전":"이번 달"}
function ago(ms){var h=Math.max(0,(Date.now()-ms)/36e5);return h<1?"방금":h<24?Math.floor(h)+"시간 전":Math.floor(h/24)+"일 전"}
function dur(iso){var m=/^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso||"");return m?(+m[1]||0)*86400+(+m[2]||0)*3600+(+m[3]||0)*60+(+m[4]||0):0}
function vurl(v){return "https://www.youtube.com/watch?v="+encodeURIComponent(v.i)}
function churl(c){return "https://www.youtube.com/channel/"+encodeURIComponent(c.id)}
function vthumb(v){return "https://i.ytimg.com/vi/"+encodeURIComponent(v.i)+"/mqdefault.jpg"}
function avatar(c){return c.thumb?'<img class="av" src="'+esc(c.thumb)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<span class="av">'+esc((c.name||"?").charAt(0))+'</span>'}
function channels(){return Object.keys(DB).map(function(id){return DB[id]})}
var toastTimer;
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("on")},3200)}
function setStatus(msg){var s=$("#status");s.textContent=msg||"";s.classList.toggle("on",!!msg)}
function showError(msg){$("#errbox").innerHTML=msg?'<div class="err" role="alert"><span>'+esc(msg)+'</span><button type="button" data-act="err-close" aria-label="닫기">✕</button></div>':"";if(msg){try{window.scrollTo(0,0)}catch(e){}}}
var keyMsg=null;
var FULL_MSG="저장 공간이 부족해 일부 데이터가 저장되지 않았습니다. '데이터 수집·설정'에서 오래된 채널을 정리해 주세요.";
function idbOpen(){return new Promise(function(res,rej){var r=indexedDB.open("channel-radar",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbGet(k){return idbOpen().then(function(d){return new Promise(function(res,rej){var q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function idbSet(k,v){return idbOpen().then(function(d){return new Promise(function(res,rej){var tx=d.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)}})})}
var useIdb=!!window.indexedDB;
function saveDB(){
  if(!useIdb){if(!LS.set("cr.db",DB))showError(FULL_MSG);return}
  var txt=JSON.stringify(DB,function(key,val){return key==="_v"?undefined:val});
  idbSet("db",txt)["catch"](function(){showError(FULL_MSG)});
}
function loadDB(){
  var old=LS.get("cr.db",null);
  if(!useIdb){DB=old||{};return Promise.resolve()}
  return idbGet("db").then(function(txt){
    if(txt){DB=JSON.parse(txt)}
    else if(old){DB=old;return idbSet("db",JSON.stringify(old)).then(function(){try{localStorage.removeItem("cr.db")}catch(e){}})}
  })["catch"](function(){useIdb=false;DB=old||{}});
}
function saveFav(){LS.set("cr.fav",FAV);$("#favCnt").textContent=Object.keys(FAV).length||""}

/* ================= 지표 계산 ================= */
function calc(c){
  var now=Date.now(),vids=(c.vids||[]).slice().sort(function(a,b){return b.p-a.p});
  var r5=vids.slice(0,5),sum=0;r5.forEach(function(v){sum+=v.v});
  var avg=r5.length?sum/r5.length:null;
  var week=0;vids.forEach(function(v){if(now-v.p<7*DAY)week+=v.v});
  var daily=null,real=false,ds=Object.keys(c.h||{}).sort();
  if(ds.length>=2){
    var a=ds[ds.length-2],b=ds[ds.length-1],dd=Math.max(1,Math.round((Date.parse(b)-Date.parse(a))/DAY)),diff=(c.h[b]-c.h[a])/dd;
    if(diff>=0){daily=diff;real=true}
  }
  if(daily==null&&vids.length){daily=0;vids.forEach(function(v){daily+=v.v/Math.max(1,(now-v.p)/DAY)})}
  var cnt={},cat=0,best=0;vids.forEach(function(v){if(!v.c)return;cnt[v.c]=(cnt[v.c]||0)+1;if(cnt[v.c]>best){best=cnt[v.c];cat=v.c}});
  return {vids:vids,avg:avg,ratio:(c.subs>0&&avg!=null)?avg/c.subs:null,week:week,daily:daily,real:real,cat:cat?(CAT[cat]||"기타"):"분류 없음"};
}
function rebuild(){M={};channels().forEach(function(c){M[c.id]=calc(c)})}

/* ================= 유튜브 API ================= */
function quotaDay(){try{return new Date().toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"})}catch(e){return today()}}
function addQuota(n,isSearch){var d=quotaDay();if(QUOTA.day!==d)QUOTA={day:d,used:0,search:0};if(isSearch)QUOTA.search=(QUOTA.search||0)+1;else QUOTA.used+=n;LS.set("cr.quota",QUOTA);drawQuota()}
function drawQuota(){var d=quotaDay();if(QUOTA.day!==d)QUOTA={day:d,used:0,search:0};$("#quota").textContent=KEY?"오늘 사용량 약 "+QUOTA.used.toLocaleString("ko-KR")+" / 10,000 · 키워드 검색 "+(QUOTA.search||0)+" / 100":""}
function explain(reason,msg,status){
  msg=msg||"";
  if(/API key not valid/i.test(msg)||reason==="keyInvalid")return "API 키가 올바르지 않습니다. 키를 다시 복사해 붙여 넣어 주세요.";
  if(reason==="quotaExceeded"||reason==="dailyLimitExceeded"||/quota/i.test(msg))return "오늘 유튜브 API 무료 사용량을 모두 썼습니다. 한국 시간으로 오후 4~5시쯤 다시 채워집니다.";
  if(reason==="accessNotConfigured"||/has not been used|is disabled/i.test(msg))return "이 키의 프로젝트에 'YouTube Data API v3'가 켜져 있지 않습니다. 구글 클라우드 콘솔에서 사용 설정해 주세요.";
  if(/referer|referrer|IP address|blocked/i.test(msg)||reason==="ipRefererBlocked")return "API 키에 웹사이트 또는 IP 제한이 걸려 있어 이 프로그램에서 쓸 수 없습니다. 키 설정의 '애플리케이션 제한사항'을 '없음'으로 바꿔 주세요.";
  return "유튜브 요청이 실패했습니다 ("+status+"). "+msg;
}
async function api(path,params,cost){
  params.key=KEY;
  var r;
  try{r=await fetch("https://www.googleapis.com/youtube/v3/"+path+"?"+new URLSearchParams(params).toString())}
  catch(e){var ne=new Error("유튜브에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요. 인터넷이 정상이라면 백신이나 방화벽이 이 프로그램의 인터넷 사용을 막고 있는지 확인해 주세요.");ne.fatal=true;throw ne}
  addQuota(cost,path==="search");
  var j={};try{j=await r.json()}catch(e){}
  if(!r.ok){
    var er=j.error||{},reason=(er.errors&&er.errors[0]&&er.errors[0].reason)||"";
    var err=new Error(explain(reason,er.message,r.status));
    err.status=r.status;err.reason=reason;
    err.fatal=!(r.status===404||/NotFound|videoChart/i.test(reason));
    throw err;
  }
  return j;
}
/* 채널 id 목록 -> 채널 정보 + 최근 영상 10개 */
async function loadChannels(ids,opt,status){
  var t=today(),i;
  for(i=0;i<ids.length;i+=50){
    var j=await api("channels",{part:"snippet,statistics,contentDetails",id:ids.slice(i,i+50).join(","),maxResults:50},1);
    (j.items||[]).forEach(function(it){
      var s=it.statistics||{},sn=it.snippet||{};
      var c=DB[it.id]||(DB[it.id]={id:it.id,tags:[],h:{},vids:[],added:Date.now()});
      c.name=sn.title||"";c.handle=sn.customUrl||"";
      c.thumb=((sn.thumbnails||{})["default"]||{}).url||"";
      c.country=sn.country||c.country||opt.region||"";
      c.created=Date.parse(sn.publishedAt)||null;
      c.subs=s.hiddenSubscriberCount?null:(+s.subscriberCount||0);
      c.views=+s.viewCount||0;c.videoCount=+s.videoCount||0;
      c.uploads=((it.contentDetails||{}).relatedPlaylists||{}).uploads||"";
      c.h=c.h||{};c.h[t]=c.views;
      var hk=Object.keys(c.h).sort();while(hk.length>8)delete c.h[hk.shift()];
      c.tags=c.tags||[];
      if(opt.tag&&c.tags.indexOf(opt.tag)<0)c.tags.push(opt.tag);
    });
    status("채널 정보 받는 중 "+Math.min(i+50,ids.length)+" / "+ids.length);
  }
  if(opt.statsOnly)return;
  // skipRecent: 영상을 받은 지 12시간이 안 된 채널은 수치만 갱신해 사용량을 아낀다
  var list=ids.filter(function(id){var c=DB[id];return c&&c.uploads&&!(opt.skipRecent&&c.upd&&Date.now()-c.upd<12*36e5&&(c.vids||[]).length)});
  for(i=0;i<list.length;i+=6){
    await Promise.all(list.slice(i,i+6).map(async function(id){
      try{var pj=await api("playlistItems",{part:"contentDetails",playlistId:DB[id].uploads,maxResults:10},1);
        DB[id]._v=(pj.items||[]).map(function(x){return x.contentDetails&&x.contentDetails.videoId}).filter(Boolean)}
      catch(e){if(e.fatal)throw e;DB[id]._v=[]}
    }));
    status("최근 영상 목록 받는 중 "+Math.min(i+6,list.length)+" / "+list.length);
  }
  var owner={},all=[],got={};
  list.forEach(function(id){(DB[id]._v||[]).forEach(function(v){owner[v]=id;all.push(v)})});
  for(i=0;i<all.length;i+=50){
    var vj=await api("videos",{part:"snippet,statistics,contentDetails",id:all.slice(i,i+50).join(","),maxResults:50},1);
    (vj.items||[]).forEach(function(v){
      var o=owner[v.id];if(!o)return;
      (got[o]=got[o]||[]).push({i:v.id,t:(v.snippet||{}).title||"",v:+((v.statistics||{}).viewCount)||0,p:Date.parse((v.snippet||{}).publishedAt)||0,d:dur((v.contentDetails||{}).duration),c:+((v.snippet||{}).categoryId)||0});
    });
    status("영상 조회수 받는 중 "+Math.min(i+50,all.length)+" / "+all.length);
  }
  list.forEach(function(id){
    if(got[id])DB[id].vids=got[id].sort(function(a,b){return b.p-a.p});
    delete DB[id]._v;DB[id].upd=Date.now();
  });
}
async function collectAllRegions(status){
  var total=0,fresh=0,done=0,stopped=false,skipped=0;
  for(var r=0;r<REGIONS.length;r++){
    if(QUOTA.used>=9000){stopped=true;break}                                   // 하루 한도를 넘기지 않도록 멈춤
    var code=REGIONS[r][0],name=REGIONS[r][1],pre="["+(r+1)+"/"+REGIONS.length+" "+name+"] ";
    try{
      var res=await collectPopular(code,function(m){status(pre+m)},200,1,true);
      total+=res.all;fresh+=res.fresh;done++;
    }catch(e){if(!e.status||e.status===403||e.reason==="quotaExceeded")throw e;skipped++}   // 그 나라 차트가 없으면 건너뜀
  }
  return done+"개국 · 채널 "+total+"개 (새 채널 "+fresh+"개)"+(stopped?" · 오늘 사용량이 한도에 가까워 여기서 멈췄습니다":"")+(skipped?" · 차트가 없는 "+skipped+"개국은 건너뜀":"");
}
async function collectPopular(region,status,max,pages,raw){
  var ids={},n=0,MAX=max||1000,PAGES=pages||4,cats=["",1,2,10,15,17,19,20,22,23,24,25,26,27,28,29];
  for(var i=0;i<cats.length&&n<MAX;i++){
    var token="";
    for(var pg=0;pg<PAGES&&n<MAX;pg++){          // 분류마다 인기 차트를 최대 200위까지
      var p={part:"snippet",chart:"mostPopular",regionCode:region,maxResults:50};
      if(cats[i])p.videoCategoryId=cats[i];
      if(token)p.pageToken=token;
      try{
        var j=await api("videos",p,1);
        (j.items||[]).forEach(function(v){var c=v.snippet&&v.snippet.channelId;if(c&&!ids[c]&&n<MAX){ids[c]=1;n++}});
        token=j.nextPageToken||"";
      }catch(e){if((i===0&&pg===0)||e.reason==="quotaExceeded"||e.status===403)throw e;token=""}   // 일부 분류는 인기 차트가 없어 건너뜀
      if(!token)break;
    }
    status("인기 영상 차트 확인 중 "+(i+1)+" / "+cats.length+" · 채널 "+n+"개 발견");
  }
  var all=Object.keys(ids),fresh=all.filter(function(id){return !DB[id]}).length;
  await loadChannels(all,{region:region,skipRecent:true},status);
  if(raw)return {all:all.length,fresh:fresh};
  return "채널 "+all.length+"개 (새 채널 "+fresh+"개)";
}
async function collectKeyword(q,region,days,status){
  status("'"+q+"' 검색 중");
  var j=await api("search",{part:"snippet",type:"video",q:q,order:"viewCount",publishedAfter:new Date(Date.now()-days*DAY).toISOString(),regionCode:region,relevanceLanguage:LANG[region]||"en",maxResults:50},100);
  var ids={};(j.items||[]).forEach(function(it){if(it.snippet&&it.snippet.channelId)ids[it.snippet.channelId]=1});
  await loadChannels(Object.keys(ids),{region:region,tag:q},status);
  return Object.keys(ids).length;
}
async function fetchChannel(q,status){
  q=String(q).trim();var ids=[],m,bySearch=false;
  status("'"+q+"' 채널 찾는 중");
  if((m=/(UC[\w-]{22})/.exec(q)))ids=[m[1]];
  else if((m=/@([^\s\/?#]+)/.exec(q))||(m=/^([A-Za-z0-9._-]{3,30})$/.exec(q))){
    var h="@"+m[1];try{h="@"+decodeURIComponent(m[1])}catch(e){}
    var j=await api("channels",{part:"id",forHandle:h},1);
    ids=(j.items||[]).map(function(x){return x.id});
  }
  if(!ids.length&&window.radar&&window.radar.resolve&&!/^https?:/i.test(q)){
    try{var rr=await window.radar.resolve(q);if(rr&&rr.ok&&rr.id)ids=[rr.id]}catch(e){}
  }
  if(!ids.length){
    bySearch=true;
    var sj=await api("search",{part:"snippet",type:"channel",q:q.replace(/^@/,""),maxResults:10},100);
    ids=(sj.items||[]).map(function(x){return (x.id&&x.id.channelId)||(x.snippet&&x.snippet.channelId)}).filter(Boolean);
  }
  if(!ids.length)throw new Error("유튜브에서 '"+q+"' 채널을 찾지 못했습니다. 핸들(@이름)이나 채널 주소를 다시 확인해 주세요.");
  await loadChannels(ids,{},status);
  // 한글 핸들처럼 채널 이름과 다른 말로 찾았을 때도 다음부터 그 말로 검색되게 기억해 둔다
  // 검색으로 찾은 후보들도 같은 검색어로 목록에 보이게 한다
  ids.forEach(function(id){var c=DB[id];if(!c)return;c.alias=c.alias||[];if(c.alias.indexOf(q)<0&&c.alias.length<5)c.alias.push(q)});
  if(bySearch)setTimeout(function(){toast("핸들로 바로 찾지 못해 이름이 비슷한 채널 "+ids.length+"개를 불러왔습니다. 내 채널이 없으면 영문 핸들이나 채널 주소로 다시 해 보세요.")},400);
  return ids.length;
}

function norm(x){var t=String(x||"");try{t=decodeURIComponent(t)}catch(e){}return t.toLowerCase().replace(/https?:\/\/(www\.)?youtube\.com\/(channel\/)?/g,"").replace(/[@\s]/g,"")}
function hotList(){
  var f=st.hot,q=norm(f.q);
  return sortList(channels().filter(function(c){
    if(!match(c,f))return false;
    var s=c.subs;
    if(f.subs!=="ALL"){
      if(s==null)return false;
      if(f.subs==="A"&&s>=1000)return false;
      if(f.subs==="B"&&(s<1000||s>=1e4))return false;
      if(f.subs==="C"&&(s<1e4||s>=1e5))return false;
      if(f.subs==="D"&&(s<1e5||s>=1e6))return false;
      if(f.subs==="E"&&s<1e6)return false;
    }
    if(q&&norm(c.name+" "+c.handle+" "+c.id+" "+(c.alias||[]).join(" ")).indexOf(q)<0)return false;
    return true;
  }));
}

var JOSA=/(에서|으로|까지|부터|에게|한테|처럼|보다|을|를)$/;
function tokens(t){
  var out={};
  String(t).toLowerCase().split(/[^\p{L}\p{N}]+/u).forEach(function(w){
    if(/[\uac00-\ud7a3]/.test(w)&&w.length>=3)w=w.replace(JOSA,"");       // 한글 조사 일부 떼기
    if(/^[a-z0-9]+$/.test(w)&&w.length<3)return;                            // 두 글자 이하 영어는 버림
    if(w.length>=2&&w.length<=20&&!STOP[w]&&!/^\d+$/.test(w))out[w]=1;
  });
  return Object.keys(out);
}
function langOk(w){var l=st.kw.lang;return l==="ALL"||(l==="ko"?/[\uac00-\ud7a3]/.test(w):/^[a-z0-9]+$/.test(w))}
function weekly(){
  var now=Date.now(),map={};
  channels().forEach(function(c){
    if(!match(c,st.kw))return;
    (c.vids||[]).forEach(function(v){
      if(now-v.p>7*DAY)return;
      tokens(v.t).forEach(function(w){if(!langOk(w))return;var k=map[w]||(map[w]={word:w,views:0,chs:{}});k.views+=v.v;(k.chs[c.id]=k.chs[c.id]||[]).push(v)});
    });
  });
  return Object.keys(map).map(function(w){return map[w]}).filter(function(k){return Object.keys(k.chs).length>=2}).sort(function(a,b){return b.views-a.views}).slice(0,30);
}

function renderVideos(){

  drawer.innerHTML='<div class="head">'+avatar(c)+'<div><h3>'+esc(c.name)+'</h3><div class="meta">'+esc(c.handle)+' · '+esc(cname(c.country))+' · '+esc(m.cat)+'</div></div><button class="x" type="button" data-act="close">닫기</button></div>'+
   '<div class="stats"><div class="stat key"><span>구독자 대비 배수</span><b>'+(m.ratio==null?"–":"×"+m.ratio.toFixed(1))+'</b></div><div class="stat"><span>일일 조회수'+(m.real?"":" (추정)")+'</span><b>'+fmt(m.daily)+'</b></div>'+
   '<div class="stat"><span>구독자</span><b>'+(c.subs==null?"비공개":fmt(c.subs))+'</b></div><div class="stat"><span>최근 영상 평균 조회수</span><b>'+fmt(m.avg)+'</b></div>'+
   '<div class="stat"><span>전체 조회수</span><b>'+fmt(c.views)+'</b></div><div class="stat"><span>영상 수 · 개설</span><b style="font-size:15px">'+fmt(c.videoCount)+'개 · '+age(c.created)+'</b></div></div>'+
   '<a class="btn yt block" href="'+churl(c)+'" target="_blank" rel="noopener">유튜브에서 채널 열기</a>'+
   '<button type="button" class="btn ghost block" data-act="fav" data-id="'+esc(id)+'">'+(FAV[id]?"즐겨찾기에서 빼기":"즐겨찾기에 추가")+'</button>'+
   '<h2 style="margin-top:20px">최근 영상</h2>'+
   (m.vids.length?m.vids.map(function(v){return '<a class="rv" href="'+vurl(v)+'" target="_blank" rel="noopener"><img src="'+vthumb(v)+'" alt="" loading="lazy"><span><b>'+esc(v.t)+'</b><small>'+(v.d>0&&v.d<=60?"쇼츠":"롱폼")+' · 조회수 '+fmt(v.v)+' · '+ago(v.p)+'</small></span></a>'}).join(""):'<p class="lead">받아 온 영상이 없습니다.</p>')+
   '<button type="button" class="btn ghost block" data-act="refresh-one" data-id="'+esc(id)+'">이 채널 새로고침</button>'+
   '<button type="button" class="btn danger block" data-act="delete-one" data-id="'+esc(id)+'">이 채널 목록에서 지우기</button>';
  drawer.classList.add("open");shade.classList.add("open");
}
function closeDrawer(){drawer.classList.remove("open");shade.classList.remove("open");openId=null}

/* ================= 이벤트 ================= */
var armed=null;
function confirmTwice(btn,label){if(armed===btn)return true;armed=btn;btn.dataset.old=btn.textContent;btn.textContent=label;setTimeout(function(){if(armed===btn){armed=null;btn.textContent=btn.dataset.old}},4000);return false}
document.addEventListener("click",function(e){
  var t=e.target,a;
  if(t===shade){closeDrawer();return}
  var th=t.closest("[data-theme-set]");
  if(th){clickSound();setTheme(th.dataset.themeSet);return}
  if(t.closest("#nav a,.brand,[data-sort],[data-kw],[data-chip],.star,.ibtn,[data-ch]"))clickSound();
  var s=t.closest("[data-star]");
  if(s){var sid=s.dataset.star;if(FAV[sid])delete FAV[sid];else FAV[sid]=1;saveFav();if(cur==="favorites")curDraw();else{s.classList.toggle("on");s.setAttribute("aria-pressed",s.classList.contains("on"))}return}
  var chip=t.closest("[data-chip]");
  if(chip){$("#kwIn").value=chip.dataset.chip;$("#kwIn").focus();return}
  var so=t.closest("[data-sort]");
  if(so){var k=so.dataset.sort;if(st.hot.sort===k)st.hot.dir=-st.hot.dir;else{st.hot.sort=k;st.hot.dir=-1}curDraw();return}
  var kwr=t.closest("[data-kw]");
  if(kwr){var w=kwr.dataset.kw;st.kw.open=st.kw.open===w?null:w;curDraw();return}
  a=t.closest("[data-act]");
  if(a){
    var act=a.dataset.act,id=a.dataset.id;
    if(act==="err-close")showError("");
    else if(act==="fetch-ch"){var fq=st.hot.q.trim();if(fq)run("채널 불러오기",function(status){return fetchChannel(fq,status)})}
    else if(act==="browser"){BROWSER=id==="default"?"default":"chrome";LS.set("cr.browser",BROWSER);if(window.radar&&window.radar.setBrowser)window.radar.setBrowser(BROWSER);renderCollect()}
    else if(act==="sound"){SOUND=!SOUND;LS.set("cr.sound",SOUND);soundMsg="";clickSound();renderCollect()}
    else if(act==="sound-test"){clickSound(true);setTimeout(function(){clickSound(true)},450);setTimeout(function(){
      var okDev=actx&&actx.state==="running";
      var done=function(m){soundMsg=m;if(cur==="collect")renderCollect()};
      if(soundErr)done("소리를 재생하지 못했습니다: "+soundErr);
      else if(okDev)done("'딸깍' 소리를 두 번 재생했습니다. 소리 장치는 정상적으로 켜졌습니다. 안 들렸다면 스피커 음량과 윈도우 '볼륨 믹서'를 확인해 주세요.");
      else done("이 컴퓨터에서는 프로그램이 소리 장치를 켜지 못해 효과음이 나지 않습니다. 프로그램의 다른 기능은 그대로 쓸 수 있습니다.");
    },1500)}
    else if(act==="check-update"){checkUpdate(false)}
    else if(act==="apply-update"){
      a.disabled=true;a.textContent="업데이트 받는 중…";
      window.radar.apply().then(function(r){if(!r||!r.ok){upd={ok:false,error:(r&&r.error)||"알 수 없는 오류"};renderCollect()}});
    }
    else if(act==="close")closeDrawer();
    else if(act==="more"){st.hot.limit+=50;curDraw()}
    else if(act==="fav"){if(FAV[id])delete FAV[id];else FAV[id]=1;saveFav();curDraw();openDrawer(id)}
    else if(act==="save-key"){
      var v=$("#keyIn").value.trim();
      if(!v){toast("API 키를 붙여 넣어 주세요.");return}
      KEY=v;a.disabled=true;a.textContent="확인 중…";
      run("API 키 확인",function(){return api("videos",{part:"id",chart:"mostPopular",regionCode:"KR",maxResults:1},1).then(function(){
          var saved=LS.set("cr.key",KEY);drawQuota();
          keyMsg={ok:true,text:saved?"확인 완료. 키가 정상이고 이 컴퓨터에 저장했습니다. 이제 아래 2번이나 3번으로 채널을 가져오세요.":"키는 정상이지만 이 브라우저가 저장을 막고 있어 창을 닫으면 다시 넣어야 합니다."};
        })["catch"](function(err){KEY=LS.get("cr.key","");keyMsg={ok:false,text:"확인 실패: "+(err.message||err)};throw err})});
    }
    else if(act==="popular"){var pr=$("#popRegion").value;run("인기 채널 가져오기",function(status){return pr==="ALL"?collectAllRegions(status):collectPopular(pr,status)})}
    else if(act==="keyword"){
      var q=$("#kwIn").value.trim(),kr=$("#kwRegion").value,kd=+$("#kwDays").value;
      if(!q){toast("키워드를 입력해 주세요.");return}
      run("'"+q+"' 채널 찾기",function(status){return collectKeyword(q,kr,kd,status)});
    }
    else if(act==="refresh-all"){var all=Object.keys(DB);run("전체 새로고침",function(status){return loadChannels(all,{},status).then(function(){return all.length})})}
    else if(act==="refresh-one"){run("채널 새로고침",function(status){return loadChannels([id],{},status).then(function(){})}).then(function(){if(DB[id])openDrawer(id)})}
    else if(act==="delete-one"){if(!confirmTwice(a,"정말 지울까요? 한 번 더 누르세요"))return;armed=null;delete DB[id];delete FAV[id];rebuild();saveDB();saveFav();closeDrawer();route()}
    else if(act==="wipe"){if(!confirmTwice(a,"정말 정리할까요? 한 번 더 누르세요"))return;armed=null;Object.keys(DB).forEach(function(k){if(!FAV[k])delete DB[k]});rebuild();saveDB();toast("즐겨찾기 외 채널을 정리했습니다.");route()}
    return;
  }
  if(t.closest("a"))return;
  var ch=t.closest("[data-ch]");
  if(ch)openDrawer(ch.dataset.ch);
});
document.addEventListener("change",function(e){
  var el=e.target;if(!el.dataset||!el.dataset.p)return;
  clickSound();
  st[el.dataset.p][el.dataset.k]=el.value;
  if(el.dataset.p==="hot")st.hot.limit=50;
  curDraw();
});
document.addEventListener("input",function(e){if(e.target.id==="hotQ"){st.hot.q=e.target.value;st.hot.limit=50;drawHot()}});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&openId!==null){closeDrawer();return}
  if(e.key==="Enter"&&e.target.id==="hotQ"&&st.hot.q.trim()&&!hotList().length){var fb=document.querySelector('[data-act="fetch-ch"]');if(fb)fb.click();return}
  if(e.key==="Enter"&&e.target.id==="kwIn"){var b=document.querySelector('[data-act="keyword"]');if(b)b.click();return}
  if(e.key==="Enter"&&e.target.id==="keyIn"){var kb=document.querySelector('[data-act="save-key"]');if(kb)kb.click();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-kw]")){e.preventDefault();e.target.click()}
});
document.addEventListener("pointerdown",wakeAudio,true);
document.addEventListener("pointerdown",function(e){if(e.target.matches&&e.target.matches("select[data-p]"))clickSound()});
window.addEventListener("hashchange",function(){closeDrawer();route()});

$("#verTag").textContent="v"+APP_VERSION;
saveFav();drawQuota();setTheme(document.documentElement.dataset.theme);
loadDB().then(function(){rebuild();route();autoStats()});
if(window.radar&&window.radar.info){window.radar.info().then(function(i){shellInfo=i;if(cur==="collect")renderCollect()},function(){})}
if(window.radar){try{window.radar.ready();if(window.radar.setBrowser)window.radar.setBrowser(BROWSER)}catch(e){}checkUpdate(true)}
</script>
</body>
</html>
